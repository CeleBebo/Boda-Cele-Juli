async function save(){

 try{
  var art=inClaude?await window.claude.use('artifact'):null;
  if(!art)throw new Error('na');
  var st=JSON.parse(JSON.stringify(ST));st.savedAt=Date.now();st.mode='edit';
  await art.publish(buildDoc(st));
  try{localStorage.removeItem(DRAFT)}catch(e){}

  var c=e&&(e.code||e.message)||'';
  toast(/not_writer|not_granted/.test(c)?'Solo lectura: no tienes permiso para guardar':c==='conflict'?'Alguien guardó primero; se recargó su versión':'No se pudo guardar en la nube. Tu borrador sigue en este dispositivo.');

function assign(ids,tid){
 ids=ids.filter(function(id){var g=ST.guests.find(function(x){return x.id===id});return g&&g.t!==tid});
 if(!ids.length)return;
 if(tid){var f=free(tid);if(ids.length>f){toast(tname(T(tid))+' solo tiene '+f+' asiento'+(f===1?'':'s')+' libre'+(f===1?'':'s')+' (máx. '+T(tid).cap+')');return false}}

 if(tid)toast(ids.length+' → '+tname(T(tid)));
 ui.sel.clear();changed();return true;
}
async function autoFill(){
 var pend=ST.guests.filter(function(g){return !g.t&&g.s==='A'});
 if(!pend.length){toast('No hay confirmados sin mesa');return}
 if(!await ask('¿Sentar automáticamente a los '+pend.length+' confirmados sin mesa, en el orden de la lista (mantiene juntas a las personas que aparecen seguidas)? Luego puedes moverlos.','Auto-asignar'))return;
 snapshot();
 var order=ST.tables.filter(function(t){return t.type!=='head'});

 if(i<pend.length)toast('Quedaron '+(pend.length-i)+' sin asiento: no hay más espacio');
 changed();
}

// ------------------------------------------------ chart
function qrUrl(){return ST.qrUrl||(ST.artifactUrl?ST.artifactUrl+'#buscar':'')}
function qrSvg(url){try{var q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}}
function sortedGuests(){return ST.guests.filter(function(g){return g.t}).slice().sort(function(a,b){return norm(a.n).localeCompare(norm(b.n))})}
function posterEl(){
 var cards=h('div',{class:'cards'});
 ST.tables.forEach(function(t){var p=seated(t.id);if(!p.length)return;
  cards.appendChild(h('div',{class:'card'+(t.type!=='round'?' head':'')},[h('h4',null,[t.type==='round'?t.label:t.label]),h('div',{class:'c'},[t.type==='round'?'Mesa':t.type==='head'?'Novios':'Mesa']),h('ol',null,p.map(function(g){return h('li',null,[g.n])}))]))});
 var idx=h('div',{class:'idx'}),L='';
 sortedGuests().forEach(function(g){var l=norm(g.n)[0].toUpperCase();if(l!==L){L=l;idx.appendChild(h('div',{class:'L'},[l]))}idx.appendChild(h('div',null,[h('span',null,[g.n]),h('b',null,[tshort(T(g.t)).replace(/^M/,'')])]))});
 var url=qrUrl(),svg=url?qrSvg(url):'';
 return h('div',{class:'poster'},[
  h('header',null,[h('div',{class:'k'},['Bienvenidos']),h('h1',null,[ST.couple]),h('div',{class:'orn'},['❦']),h('div',{class:'d'},[ST.subtitle||'Seating Chart'])]),
  cards,
  svg?h('div',{class:'qrbox'},[h('div',{class:'q',html:svg}),h('div',{class:'t'},[h('b',null,['Encuentra tu mesa']),h('span',null,['Escanea con la cámara de tu celular y escribe tu nombre.'])])]):null,
  h('div',{class:'sec'},['Índice de invitados']),h('div',{class:'orn'},['❦']),idx
 ]);
}
function chartText(){return ST.tables.map(function(t){var p=seated(t.id);return p.length?tname(t)+' ('+p.length+')\n'+p.map(function(g){return '  • '+g.n}).join('\n'):''}).filter(Boolean).join('\n\n')}
function renderChart(standalone){
 var unseated=ST.guests.filter(function(g){return !g.t}).length;
 var tools=standalone?h('div',{class:'tools'},[h('button',{class:'btn pri',onclick:function(){window.print()}},['Imprimir / Guardar PDF'])]):h('div',{class:'tools'},[
  h('button',{class:'btn',onclick:function(){location.hash=''}},['← Volver al plano']),
  h('input',{type:'url',placeholder:'Enlace del QR (ej. https://tusitio.github.io/mesa)',value:ST.qrUrl||'',onchange:function(e){snapshot();ST.qrUrl=e.target.value.trim();changed()}}),
  h('button',{class:'btn gold',onclick:function(){var st=JSON.parse(JSON.stringify(ST));st.mode='chart';download('seating-chart.html',buildDoc(st,'Seating Chart — '+ST.couple))}},['Descargar seating chart']),
  h('button',{class:'btn',onclick:function(){var st=JSON.parse(JSON.stringify(ST));st.mode='finder';st.guests=st.guests.filter(function(g){return g.t}).map(function(g){return {id:g.id,n:g.n,s:'A',t:g.t}});download('encuentra-tu-mesa.html',buildDoc(st,'Encuentra tu mesa — '+ST.couple))}},['Descargar buscador (QR)']),
  h('button',{class:'btn',onclick:function(){var csv='Nombre,Mesa\n'+sortedGuests().map(function(g){return '"'+g.n.replace(/"/g,'""')+'","'+tname(T(g.t))+'"'}).join('\n');download('mesas.csv',csv,'text/csv')}},['CSV']),
  h('button',{class:'btn',onclick:function(){navigator.clipboard.writeText(chartText()).then(function(){toast('Lista copiada')},function(){toast('No se pudo copiar')})}},['Copiar lista'])
 ]);
 var notes=[];
 if(!standalone){
  if(unseated)notes.push(h('div',{class:'note'},['Faltan '+unseated+' invitados por sentar; no aparecen en el chart.']));
  notes.push(h('div',{class:'note'},[ST.qrUrl?'El QR abre: '+ST.qrUrl:'El QR abre el buscador dentro de este artefacto (requiere que el invitado tenga acceso en Claude). Para que cualquiera lo abra sin cuenta: usa “Descargar buscador”, súbelo a un enlace público (p. ej. GitHub Pages) y pega ese enlace arriba — el QR se regenera solo.']));
 }
 root.replaceChildren(h('div',{class:'chart'},[tools].concat(notes,[posterEl()])));
}

// ------------------------------------------------ finder
function renderFinder(){
 var found=null,q='';
 var input=h('input',{class:'search',type:'search',placeholder:'Escribe tu nombre…',autocomplete:'off'});
 var res=h('div',{class:'res'}),out=h('div');
 function show(g){
  found=g;res.replaceChildren();input.value=g.n;
  var t=T(g.t),mates=seated(t.id).filter(function(x){return x!==g}).map(function(x){return x.n});
  var mini=h('div',{class:'mini'});
  out.replaceChildren(h('div',{class:'found'},[h('div',{class:'who'},[g.n+', tu mesa es']),h('div',{class:'big'},[t.type==='round'?'Mesa '+t.label:t.label]),mates.length?h('div',{class:'mates'},['Compartes con: '+mates.join(', ')]):null,mini]));
  var st=planEl({hl:t.id,noBadge:true,tilt:48,rot:-14,zoom:1.12});mini.appendChild(st);requestAnimationFrame(st._layout);
 }
 input.addEventListener('input',function(){q=norm(input.value.trim());out.replaceChildren();if(q.length<2){res.replaceChildren();return}
  var words=q.split(/\s+/);
  var m=ST.guests.filter(function(g){if(!g.t)return false;var n=norm(g.n);return words.every(function(w){return n.indexOf(w)>=0})}).slice(0,8);
  res.replaceChildren.apply(res,m.length?m.map(function(g){return h('button',{onclick:function(){show(g)}},[h('span',null,[g.n]),h('b',null,[tshort(T(g.t))])])}):[h('div',{class:'empty',style:'text-align:center'},['No encontramos ese nombre. Pregunta en la entrada 💛'])]);
 });
 root.replaceChildren(h('div',{class:'finder'},[h('div',{class:'k'},['Bienvenidos']),h('h1',null,[ST.couple]),h('div',{class:'lead'},['Encuentra tu mesa']),h('div',{class:'box'},[input,res,out]),
  MODE==='edit'?h('button',{class:'btn',style:'margin-top:24px',onclick:function(){location.hash=''}},['← Volver al editor']):null]));
 setTimeout(function(){try{input.focus()}catch(e){}},100);
}
